# Publishes the game to GitHub Pages on every push to main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The licensed pack files (models, sounds, interface art) live in the team's private repo, not this public one
      # (tools/assets/backup.mjs keeps it up to date). A read-only deploy key on that repo, kept here as the secret
      # ASSETS_DEPLOY_KEY, fetches only its assets/ folder; its catalogue notes stay behind.
      - uses: actions/checkout@v4
        with:
          repository: NikolasKorakidis/argonisos-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: _assets
          sparse-checkout: assets
          sparse-checkout-cone-mode: true
      - uses: actions/configure-pages@v5
      - name: Stage site (skip source-only folders)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '_assets' --exclude 'concept' ./ _site/
          rsync -a _assets/assets/ _site/assets/
          test -f _site/assets/models/pack/hero.glb   # (without the packs the game falls back to its carved look: don't publish that by mistake)
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
