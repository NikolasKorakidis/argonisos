# Publishes the game to GitHub Pages on every push to main: only what the game needs (index.html, src, vendor, assets,
# and the old prototype in legacy/), with the licensed packs added from the team's private repo, and stamped with the
# commit so the title screen shows which build is live. Not tests, tools (the asset manifest lists the packs), docs,
# dev pages, .claude or CLAUDE.md.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
# Two jobs, as GitHub documents it: build uploads the site, deploy publishes it. deploy-pages looks up the run's
# artifacts once; straight after an upload in the same job GitHub's listing can still be empty ("No artifacts named
# github-pages", PR #23's merge, Nov 2026). A separate job that starts after build is done doesn't hit that.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The licensed pack files (models, sounds, interface art) live in the team's private repo, not this public one
      # (tools/assets/backup.mjs keeps it up to date). A read-only deploy key on that repo, kept here as the secret
      # ASSETS_DEPLOY_KEY, fetches only its assets/ folder; its catalogue notes stay behind.
      - uses: actions/checkout@v4
        with:
          repository: NikolasKorakidis/argonisos-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: _assets
          sparse-checkout: assets
          sparse-checkout-cone-mode: true
      - uses: actions/configure-pages@v5
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src vendor assets legacy _site/
          rsync -a _assets/assets/ _site/assets/
          test -f _site/assets/models/pack/hero.glb # (without the packs the game falls back to its carved look: don't publish that by mistake)
          touch _site/.nojekyll
          # the build stamp: short commit and date, shown on the title screen
          stamp="$(git rev-parse --short HEAD) · $(date -u +'%d %b %Y %H:%M') UTC"
          sed -i "s|<meta name=\"build\" content=\"\">|<meta name=\"build\" content=\"${stamp}\">|" _site/index.html
          grep -q "content=\"${stamp}\"" _site/index.html
          # the prototype's old addresses still work
          for p in classic play; do
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=legacy/%s.html"><link rel="canonical" href="legacy/%s.html">' "$p" "$p" > "_site/$p.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
